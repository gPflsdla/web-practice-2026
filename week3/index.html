<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3주차과제</title>

    <meta name="description" content="3주차 HTML 과제 페이지 - 시맨틱 태그 구조화와 웹 접근성을 적용한 소개 및 문의하기 페이지입니다.">
    <meta property="og:title" content="3주차 과제">
    <meta property="og:description" content="시맨틱 태그, 이미지, 문의하기 폼을 포함한 웹 접근성 실습 페이지입니다.">
    <meta property="og:url" content="https://gpflsdla.github.io/web-practice-2026/week3/">
</head>
<body>
    <header>
        <img src="https://search.pstatic.net/common/?src=http%3A%2F%2Fblogfiles.naver.net%2F20130624_82%2Fif_co_1372002057446y4MDn_JPEG%2F%25C4%25AB%25C4%25AB%25BF%25C0%25C5%25E5.jpg&type=sc960_832"
        alt="카카오 로고">
        <h1>정혜린</h1>
    </header>

    <main>
        <h2>프로필</h2>
        <img src="https://search.pstatic.net/common/?src=http%3A%2F%2Fblogfiles.naver.net%2FMjAyNjAxMDJfMTUg%2FMDAxNzY3MzUxNTM5NzAw.HbPzjWH6AW8XLbcxd8WHaqsJq3FBAmHxtVmwGN2ePXEg.n4LEfAwIiRLe23hFK0jcbY4lNxjPMJdVG4Lx8Wdbb9Eg.JPEG%2F20260102_195814.jpg&type=sc960_832" 
        alt="카카오 프로필 사진">
        <p>안녕하세요, 정혜린입니다.</p>

        <h2>문의하기</h2>
        <form>
            <label for="name">이름</label>
            <input type="text" id="name">

            <label for="email">이메일</label>
            <input type="email" id="email">

            <label for="type">문의유형</label>
            <select id="type">
                <option value="a">배송</option>
                <option value="b" selected>주문</option>
                <option value="c">기타</option>
            </select>

            <label for="message">문의내용</label>
            <textarea id="message"></textarea>

            <button type="submit">보내기</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 혜린. All rights reserved.</p>
        <a href="mailto:2003lynn@naver.com">2003lynn@naver.com</a>
    </footer>
</body>
</html>
